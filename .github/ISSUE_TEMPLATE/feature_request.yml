name: Feature request
description: A new tool or an improvement to an existing one
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What should the agent be able to do?
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: UIS page
      description: Where this lives in UIS, if you know.
      placeholder: Studijny portal → Terminy skusok
