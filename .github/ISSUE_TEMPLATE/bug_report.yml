name: Bug report
description: A tool fails or returns wrong data
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Don't paste your password, cookies or other people's personal data.

  - type: input
    id: tool
    attributes:
      label: Tool
      placeholder: ais_schedule
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you asked for, what you expected, what you got.
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Claude Code, Codex, OpenCode...

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.1

  - type: textarea
    id: error
    attributes:
      label: Error
      description: The error message or traceback, if there is one.
      render: text
